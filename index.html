<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Draft — Team Rosters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <img class="hero-banner" src="footballbanner.png" alt="">
        <div class="hero-scrim"></div>
        <div class="hero-content">
            <h1 id="league-name">FPL Draft League</h1>
            <p id="league-meta"></p>
        </div>
        <button id="audio-toggle" class="audio-toggle" aria-label="Toggle music" type="button">
            <svg class="icon-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
    </header>

    <div class="layout">
        <aside class="panel panel-scorers" id="panel-scorers" aria-label="Top scoring owned players">
            <div class="panel-header">
                <h3>Top Scorers</h3>
                <div class="mode-toggle" role="tablist">
                    <button class="mode-btn active" data-mode="gw" role="tab" aria-selected="true">Last GW</button>
                    <button class="mode-btn" data-mode="total" role="tab" aria-selected="false">Season</button>
                </div>
            </div>
            <div class="best-list"></div>
        </aside>

        <main id="teams-container">
            <p class="loading">Loading rosters…</p>
        </main>

        <aside class="panel panel-available" id="panel-available" aria-label="Best available players">
            <div class="panel-header">
                <h3>Best Available</h3>
                <div class="mode-toggle" role="tablist">
                    <button class="mode-btn active" data-mode="draft" role="tab" aria-selected="true">Draft Rank</button>
                    <button class="mode-btn" data-mode="points" role="tab" aria-selected="false">Points</button>
                </div>
            </div>
            <div class="best-list"></div>
        </aside>
    </div>

    <footer>
        <p id="last-refresh">Loading…</p>
    </footer>

    <div id="player-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-card" role="dialog" aria-modal="true">
            <button class="modal-close" data-close aria-label="Close">×</button>
            <div class="modal-body"></div>
        </div>
    </div>

    <audio id="bg-audio" src="Eye%20Of%20The%20Tiger.mp3" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
